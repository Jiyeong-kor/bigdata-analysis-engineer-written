name: 빅데이터분석기사 학습 앱 배포

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: JavaScript 구문 검사
        run: |
          node --check app-core.js
          node --check app-events.js
          node --check app-home.js
          node --check app-study.js
          node --check app-v2.js
          node --check app-v2-events.js
          node --check answer-selection-fix.js
          node --check instant-choice-grading-ui.js
          node --check concept-link-fix.js
          node --check app-update.js
          node --check daily-mode.js
          node --check daily-selection.js
          node --check data-finalize.js
          node --check data-subject-1.js
          node --check data-subject-2.js
          node --check data-subject-3.js
          node --check data-subject-4.js
          node --check data-bank-subject-1.js
          node --check data-bank-subject-2.js
          node --check data-bank-subject-3.js
          node --check data-bank-subject-4.js
          node --check source-sync-patches.js
          node --check sw.js

      - name: 215문항·개념 데이터 검사
        run: node validate-data.mjs

      - name: 매일 8문제 선정 기준 검사
        run: node validate-daily.mjs

      - name: 문제 화면 UX 검사
        run: node validate-quiz-ux.mjs

      - name: GitHub Pages 구성 확인
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: 배포 파일 구성
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'README.md' --exclude 'validate-data.mjs' --exclude 'validate-daily.mjs' --exclude 'validate-quiz-ux.mjs' ./ _site/

      - name: 정적 앱 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
